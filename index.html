<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo crud task(local storage)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <h1>Todo crud with local storage</h1>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card sportCard">
                    <h3>Sport Form</h3>
                    <div class="card-body">
                        <form id="sportForm">
                            <div class="form-group">
                                <label for="sportInput">Select your sport:</label>
                                <select class="form-control" id="sportInput">
                                    <option value="Cricket">Cricket</option>
                                    <option value="Football">Football</option>
                                    <option value="Basketball">Basketball</option>
                                    <option value="Tennis">Tennis</option>
                                    <option value="Badminton">Badminton</option>
                                    <option value="Hockey">Hockey</option>
                                    <option value="Volleyball">Volleyball</option>
                                    <option value="Baseball">Baseball</option>
                                    <option value="Table Tennis">Table Tennis</option>
                                </select>
                            </div>
                            <button type="submit" id="addSportbtn" class="btn btn-sm btn-block btn-primary">Add Sport Name</button>
                            <button type="button" id="updateSportbtn" class="btn btn-sm btn-block btn-dark d-none">Update Sport Name</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
               <div class="card">
                <ul class="list-group" id="sportList">
                    <!-- <li class="list-group-item d-flex justify-content-between align-items-center">
                        <strong>Criceket</strong>
                        <div>
                           <button class="btn btn-sm text-info" role="button">EDIT</button> 
                           <button class="btn btn-sm text-dark"role="button">DELETE</button>
                        </div>
                    </li> -->
                </ul>
             </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
